[project]
name = "credit-risk-strategy"
version = "0.1.0"
description = "Behaviour scorecard and credit strategy engine on bureau + internal banking attributes"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
download = ["kaggle>=1.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
